<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS 月租费 - 支付宝付款</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans SC", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(37, 99, 235, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(124, 58, 237, 0.16) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(15, 23, 42, 0) 0%, rgba(15, 23, 42, 0.4) 100%),
                linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #f8fafc;
        }

        .payment-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            box-shadow:
                0 32px 96px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 80px rgba(37, 99, 235, 0.12) inset;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            position: relative;
        }

        .payment-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 50%, #06b6d4 100%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .glow {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
        }

        .glow-1 {
            top: -60px;
            right: -60px;
            background: #3b82f6;
        }

        .glow-2 {
            bottom: -40px;
            left: -40px;
            background: #8b5cf6;
        }

        .header {
            padding: 42px 36px 28px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.14);
            color: #93c5fd;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 999px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(59, 130, 246, 0.22);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: #60a5fa;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
        }

        .plan-section {
            padding: 0 32px 28px;
            position: relative;
            z-index: 1;
        }

        .plan-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 26px;
            position: relative;
            overflow: hidden;
        }

        .plan-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .plan-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .plan-icon {
            width: 22px;
            height: 22px;
            color: #60a5fa;
        }

        .plan-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }

        .spec {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 12px;
            transition: all 0.2s ease;
        }

        .spec:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(96, 165, 250, 0.25);
        }

        .spec-icon {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #93c5fd;
        }

        .spec-icon svg {
            width: 18px;
            height: 18px;
        }

        .spec-text {
            text-align: left;
        }

        .spec-value {
            font-size: 13px;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1.3;
        }

        .spec-label {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 1px dashed rgba(148, 163, 184, 0.25);
            position: relative;
            z-index: 1;
        }

        .price-label {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .price {
            display: flex;
            align-items: baseline;
            gap: 3px;
        }

        .currency {
            font-size: 20px;
            font-weight: 700;
            color: #60a5fa;
        }

        .amount {
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -1.5px;
            text-shadow: 0 0 40px rgba(96, 165, 250, 0.35);
        }

        .period {
            font-size: 14px;
            color: #94a3b8;
            margin-left: 3px;
        }

        .qr-section {
            padding: 0 32px 34px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .qr-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 26px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .alipay-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .alipay-logo {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #1677ff 0%, #0056d6 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(22, 119, 255, 0.35);
        }

        .alipay-text {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .qr-wrapper {
            position: relative;
            display: inline-block;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .qr-wrapper img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .scan-hint {
            margin-top: 18px;
            font-size: 14px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .scan-hint strong {
            color: #93c5fd;
            font-weight: 600;
        }

        .payee-info {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            color: #94a3b8;
        }

        .payee-name {
            color: #e2e8f0;
            font-weight: 600;
        }

        .footer {
            padding: 0 32px 34px;
            position: relative;
            z-index: 1;
        }

        .notice {
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 14px;
            padding: 16px;
            font-size: 12px;
            color: #fde68a;
            line-height: 1.7;
        }

        .notice-title {
            font-weight: 700;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 7px;
            color: #fcd34d;
        }

        @media (max-width: 480px) {
            .payment-card {
                border-radius: 24px;
            }
            .header, .plan-section, .qr-section, .footer {
                padding-left: 22px;
                padding-right: 22px;
            }
            h1 {
                font-size: 24px;
            }
            .amount {
                font-size: 38px;
            }
            .qr-wrapper img {
                width: 190px;
                height: 190px;
            }
            .specs {
                gap: 10px;
            }
            .spec {
                padding: 12px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="payment-card">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="header">
            <div class="badge">
                <span class="badge-dot"></span>
                企业级云服务器
            </div>
            <h1>VPS 月租订阅服务</h1>
            <p class="subtitle">高性能基础设施 · 即付即开 · 持续护航</p>
        </div>

        <div class="plan-section">
            <div class="plan-card">
                <div class="plan-name">
                    <svg class="plan-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                    Enterprise Cloud VPS
                </div>
                <p class="plan-desc">基于全闪存架构与 Anycast 网络的企业级虚拟私有服务器</p>

                <div class="specs">
                    <div class="spec">
                        <div class="spec-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </div>
                        <div class="spec-text">
                            <div class="spec-value">99.99% SLA</div>
                            <div class="spec-label">可用性保障</div>
                        </div>
                    </div>
                    <div class="spec">
                        <div class="spec-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            </svg>
                        </div>
                        <div class="spec-text">
                            <div class="spec-value">Anycast 加速</div>
                            <div class="spec-label">全球边缘网络</div>
                        </div>
                    </div>
                    <div class="spec">
                        <div class="spec-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                        </div>
                        <div class="spec-text">
                            <div class="spec-value">DDoS 防护</div>
                            <div class="spec-label">网络层安全清洗</div>
                        </div>
                    </div>
                    <div class="spec">
                        <div class="spec-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                <line x1="8" y1="21" x2="16" y2="21"></line>
                                <line x1="12" y1="17" x2="12" y2="21"></line>
                            </svg>
                        </div>
                        <div class="spec-text">
                            <div class="spec-value">NVMe 全闪存</div>
                            <div class="spec-label">企业级存储阵列</div>
                        </div>
                    </div>
                    <div class="spec">
                        <div class="spec-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                            </svg>
                        </div>
                        <div class="spec-text">
                            <div class="spec-value">低延迟专线</div>
                            <div class="spec-label">优质网络路由</div>
                        </div>
                    </div>
                    <div class="spec">
                        <div class="spec-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </div>
                        <div class="spec-text">
                            <div class="spec-value">24/7 监控</div>
                            <div class="spec-label">自动化运维告警</div>
                        </div>
                    </div>
                </div>

                <div class="price-row">
                    <span class="price-label">月度订阅费用</span>
                    <div class="price">
                        <span class="currency">¥</span>
                        <span class="amount">68</span>
                        <span class="period">/ 月</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="qr-section">
            <div class="qr-card">
                <div class="alipay-header">
                    <div class="alipay-logo">支</div>
                    <span class="alipay-text">支付宝扫码付款</span>
                </div>
                <div class="qr-wrapper">
                    <img src="assets/alipay-qr.jpg" alt="支付宝收款二维码">
                </div>
                <div class="scan-hint">
                    打开支付宝 <strong>[扫一扫]</strong> 完成支付
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="notice">
                <div class="notice-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    付款说明
                </div>
                请核对收款方信息后再付款。付款完成后请保留截图，服务将在确认收款后 10 分钟内开通。如对账单有疑问，请勿支付。
            </div>
        </div>
    </div>
</body>
</html>
